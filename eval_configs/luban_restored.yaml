# Prepare the runtime first; see tools/luban_runtime/README.md.
runner:
  experiment_name: luban_restored_rules
  log_dir: logs
  results_excel_path: experiment_results.xlsx
  history_length: 5

agent:
  type: openai
  model_name: qwen/qwen3-vl-30b-a3b-thinking
  temperature: 0.1
  max_tokens: 32000
  timeout: 300.0

judgement:
  type: openai
  model_name: qwen/qwen3-vl-30b-a3b-thinking
  temperature: 0.1
  max_tokens: 5000
  timeout: 300.0

environment:
  type: luban
  action_mode: restored_original_rules
  exe_path: artifacts/luban/runtime_final/LuBanSuoEnv.x86_64
  env_id: 1
  level_index: 0
  request_timeout: 310.0
  startup_timeout: 90.0
  job_worker_count: 2
  gui: false
  render_width: 512
  render_height: 512

task:
  type: luban_disassembly
  name: luban_restored
  difficulty: easy
  level_index: 0
  ruled_evaluation: true
